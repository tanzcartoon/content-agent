<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Agent Dashboard - Tanz Cartoon</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #0f1117;
    color: #e5e7eb;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #9ca3af; margin-bottom: 24px; font-size: 14px; }
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: #1a1d27;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    padding: 16px;
  }
  .stat-label { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 600; }
  .agents-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .agent-card {
    background: #1a1d27;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    padding: 18px;
  }
  .agent-icon { font-size: 24px; margin-bottom: 8px; }
  .agent-name { font-weight: 600; margin-bottom: 4px; }
  .agent-status {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: #14532d;
    color: #86efac;
    margin-bottom: 8px;
  }
  .agent-desc { font-size: 13px; color: #9ca3af; line-height: 1.5; }
  .competitors {
    background: #1a1d27;
    border: 1px solid #2a2e3a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .suggestion { border-color: #facc15; }
  .suggestion h3 { margin-top: 0; font-size: 15px; color: #facc15; }
  .sug-warn {
    background: #3b1d1d;
    border: 1px solid #7f1d1d;
    color: #fecaca;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 12px;
    line-height: 1.7;
  }
  .sug-time { font-size: 13px; color: #e5e7eb; margin-bottom: 4px; }
  .sug-reason { font-size: 12px; color: #9ca3af; margin-bottom: 14px; }
  .sug-block { border-top: 1px solid #2a2e3a; padding-top: 12px; margin-top: 12px; }
  .sug-label { font-size: 12px; color: #facc15; margin-bottom: 6px; }
  .sug-title { font-weight: 600; margin-bottom: 8px; }
  .sug-line { font-size: 13px; color: #e5e7eb; margin-bottom: 6px; line-height: 1.7; }
  .sug-twist { font-size: 13px; color: #86efac; margin-bottom: 6px; }
  .sug-tags { font-size: 12px; color: #60a5fa; margin-top: 6px; }
  .beats { font-size: 13px; color: #9ca3af; line-height: 1.8; padding-right: 20px; margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; color: #9ca3af; font-weight: 500; padding: 8px; border-bottom: 1px solid #2a2e3a; }
  td { padding: 8px; border-bottom: 1px solid #232635; }
  .highlight-row td { color: #86efac; font-weight: 600; }
  .updated { font-size: 12px; color: #6b7280; margin-top: 16px; }
  #error { color: #f87171; padding: 16px; }
</style>
</head>
<body>

<h1>Content Agent Dashboard</h1>
<div class="subtitle">طنزکارتون | Tanz Cartoon</div>

<div id="content">در حال بارگذاری داده‌ها...</div>

<script>
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function ageHours(iso) {
  var t = Date.parse(iso);
  if (isNaN(t)) return null;
  return (Date.now() - t) / 3600000;
}

function ageText(h) {
  if (h === null) return '';
  if (h < 1) return 'کمتر از یک ساعت پیش';
  if (h < 48) return Math.round(h) + ' ساعت پیش';
  return Math.round(h / 24) + ' روز پیش';
}

function tagsHtml(tags) {
  if (!tags || !tags.length) return '';
  var out = tags.map(function (t) {
    t = String(t).trim().replace(/\s+/g, '_');
    return esc(t.charAt(0) === '#' ? t : '#' + t);
  });
  return '<div class="sug-tags">' + out.join(' ') + '</div>';
}

function block(label, item, isLong) {
  var h = '<div class="sug-block">';
  h += '<div class="sug-label">' + esc(label) + '</div>';
  h += '<div class="sug-title">' + esc(item.title) + '</div>';
  h += '<div class="sug-line"><b>هوک:</b> ' + esc(item.hook) + '</div>';
  h += '<div class="sug-line">' + esc(item.scenario) + '</div>';
  if (isLong && item.beats && item.beats.length) {
    h += '<ul class="beats">';
    item.beats.forEach(function (b) { h += '<li>' + esc(b) + '</li>'; });
    h += '</ul>';
  } else if (item.twist) {
    h += '<div class="sug-twist"><b>چرخش:</b> ' + esc(item.twist) + '</div>';
  }
  if (item.thumbnail_text || item.thumbnail_image) {
    h += '<div class="sug-line"><b>🖼 تامبنیل:</b> «' + esc(item.thumbnail_text) + '» — ' + esc(item.thumbnail_image) + '</div>';
  }
  h += tagsHtml(item.hashtags);
  h += '</div>';
  return h;
}

function suggestionHtml(data) {
  var sug = data.suggestion || {};
  var shortItem = sug.short || null;
  var longItem = sug.long || null;
  if (!shortItem && !longItem && !data.last_error) return '';
  var base = data.generated_at;
  var shortAge = ageHours(data.short_generated_at || base);
  var longAge = ageHours(data.long_generated_at || base);

  var h = '<div class="competitors suggestion">';
  h += '<h3>🎬 پیشنهاد امروز</h3>';
  if (data.last_error) {
    h += '<div class="sug-warn">⚠️ ساخت سناریوی تازه ناموفق بود: ' + esc(data.last_error) + '</div>';
  }
  if (shortAge !== null && shortAge > 30) {
    h += '<div class="sug-warn">⚠️ سناریوی شورت ' + ageText(shortAge) + ' ساخته شده و امروز تازه نشده است.</div>';
  }
  if (sug.upload_time_text && shortItem) {
    h += '<div class="sug-time">⏰ زمان پیشنهادی انتشار شورت: ' + esc(sug.upload_time_text) + '</div>';
    if (sug.upload_reason) h += '<div class="sug-reason">' + esc(sug.upload_reason) + '</div>';
  }
  if (shortItem) h += block('📱 شورت امروز · ساخته شده ' + ageText(shortAge), shortItem, false);
  if (longItem) h += block('🎞 ویدیوی طولانی این هفته (نشر: شب جمعه) · ساخته شده ' + ageText(longAge), longItem, true);
  h += '</div>';
  return h;
}

async function loadDashboard() {
  var container = document.getElementById('content');
  try {
    var res = await fetch('data.json?v=' + Date.now());
    var data = await res.json();
    var main = (data.channels && data.channels.main) || {};

    var html = '';

    html += '<div class="stats-row">';
    html += '<div class="stat-card"><div class="stat-label">مشترکین</div><div class="stat-value">' + Number(main.subscribers || 0).toLocaleString() + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">بازدید کل</div><div class="stat-value">' + Number(main.views || 0).toLocaleString() + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">تعداد ویدیو</div><div class="stat-value">' + Number(main.videos || 0).toLocaleString() + '</div></div>';
    html += '</div>';

    html += '<div class="agents-grid">';
    html += '<div class="agent-card"><div class="agent-icon">💡</div><div class="agent-name">Ideator</div><div class="agent-status">فعال</div><div class="agent-desc">تحلیل رقبا و پیشنهاد ایده‌های محتوایی جدید بر اساس ترندهای موفق</div></div>';
    html += '<div class="agent-card"><div class="agent-icon">✍️</div><div class="agent-name">Hook &amp; Script</div><div class="agent-status">فعال</div><div class="agent-desc">نوشتن هوک و فیلم‌نامه بر اساس قالب تایید شده</div></div>';
    html += '<div class="agent-card"><div class="agent-icon">📅</div><div class="agent-name">Planner</div><div class="agent-status">فعال</div><div class="agent-desc">برنامه‌ریزی تقویم روزانه انتشار محتوا</div></div>';
    html += '<div class="agent-card"><div class="agent-icon">📊</div><div class="agent-name">Analyst</div><div class="agent-status">فعال</div><div class="agent-desc">تحلیل آمار کانال و رقبا، شناسایی روند رشد</div></div>';
    html += '<div class="agent-card"><div class="agent-icon">💬</div><div class="agent-name">DM Manager</div><div class="agent-status">در حال توسعه</div><div class="agent-desc">مدیریت پیام‌های مستقیم و پاسخ‌گویی خودکار</div></div>';
    html += '</div>';

    try {
      var sugRes = await fetch('suggestion.json?v=' + Date.now());
      if (sugRes.ok) {
        var sugData = await sugRes.json();
        html += suggestionHtml(sugData);
      }
    } catch (e) {
      console.log('suggestion load failed', e);
    }

    html += '<div class="competitors"><h3 style="margin-top:0; font-size:15px;">مقایسه با رقبا</h3><table>';
    html += '<tr><th>کانال</th><th>مشترکین</th><th>بازدید</th><th>ویدیو</th></tr>';
    for (var key in data.channels) {
      var ch = data.channels[key];
      var isMain = key === 'main';
      html += '<tr class="' + (isMain ? 'highlight-row' : '') + '">';
      html += '<td>' + esc(ch.title || key) + '</td>';
      html += '<td>' + Number(ch.subscribers || 0).toLocaleString() + '</td>';
      html += '<td>' + Number(ch.views || 0).toLocaleString() + '</td>';
      html += '<td>' + Number(ch.videos || 0).toLocaleString() + '</td>';
      html += '</tr>';
    }
    html += '</table></div>';

    html += '<div class="updated">آخرین بروزرسانی: ' + new Date(data.fetched_at).toLocaleString('fa-IR') + '</div>';

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = '<div id="error">خطا در بارگذاری داده‌ها: ' + esc(e.message) + '</div>';
  }
}

loadDashboard();
</script>

</body>
</html>
