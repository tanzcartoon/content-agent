name: Fetch YouTube Stats
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run fetch script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_stats.py
      - name: Generate scenario suggestion
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/suggest_scenario.py
      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py
      - name: Commit updated data
        run: |
          git config user.name "content-agent-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          if [ -f docs/suggestion.json ]; then git add docs/suggestion.json; fi
          git diff --staged --quiet || git commit -m "Update stats data"
          git push
